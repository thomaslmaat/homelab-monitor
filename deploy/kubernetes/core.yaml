apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-monitor-data
  namespace: homelab-monitor
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-monitor
  namespace: homelab-monitor
  labels:
    app.kubernetes.io/name: homelab-monitor
spec:
  replicas: 1 # SQLite is single-writer; keep Core at one replica in v1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-monitor
    spec:
      serviceAccountName: homelab-monitor
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          image: ghcr.io/thomaslmaat/homelab-monitor:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_PATH
              value: /data/homelab-monitor.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelab-monitor-data
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-monitor
  namespace: homelab-monitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-monitor
  ports:
    - name: http
      port: 8080
      targetPort: http
