apiVersion: v1
kind: Namespace
metadata:
  name: game-servers
  labels:
    app.kubernetes.io/managed-by: homelab-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-monitor-game-server-manager
  namespace: game-servers
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelab-monitor-game-server-manager
  namespace: game-servers
subjects:
  - kind: ServiceAccount
    name: homelab-monitor
    namespace: homelab-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homelab-monitor-game-server-manager
