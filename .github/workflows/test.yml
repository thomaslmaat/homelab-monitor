name: test
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check internal/dashboard/assets/app.js
      - run: node --check internal/dashboard/assets/auth.js
      - run: go mod download
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./cmd/core ./cmd/agent
